name: Update final product label data

on:
  push:
    branches: [main]
    paths:
      - "tools/update-final-label-data-20260727.py"
      - ".github/workflows/update-final-label-data-20260727.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update product data
        run: python tools/update-final-label-data-20260727.py
      - name: Remove one-time updater
        run: |
          rm -f tools/update-final-label-data-20260727.py
          rm -f .github/workflows/update-final-label-data-20260727.yml
      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html llms.txt tools/update-final-label-data-20260727.py .github/workflows/update-final-label-data-20260727.yml
          if ! git diff --cached --quiet; then
            git commit -m "Align product names and doses with final labels"
            git push
          fi
