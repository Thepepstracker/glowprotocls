name: Extract catalog context

on:
  push:
    branches: [main]
    paths:
      - scripts/extract_catalog_context.py

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract relevant catalog source
        run: python scripts/extract_catalog_context.py

      - name: Commit extracted context
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog-context.txt
          if git diff --cached --quiet; then
            echo "No context changes to commit."
          else
            git commit -m "Extract catalog context for product update"
            git push
          fi
