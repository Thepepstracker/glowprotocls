name: Audit missing product images

on:
  push:
    paths:
      - 'tools/audit_missing_images.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit catalog and WooCommerce images
        run: python tools/audit_missing_images.py
      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add missing-images-report.txt
          if git diff --cached --quiet; then
            echo "No report changes"
          else
            git commit -m "Audit missing product images"
            git push
          fi
