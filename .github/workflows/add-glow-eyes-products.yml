name: Add Glow Eyes products

on:
  push:
    branches: [main]
    paths:
      - scripts/add_glow_eyes_products.py

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image optimizer
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Add products and WooCommerce connections
        run: python scripts/add_glow_eyes_products.py

      - name: Remove temporary update tooling
        run: |
          rm -f catalog-context.txt
          rm -f scripts/extract_catalog_context.py
          rm -f scripts/add_glow_eyes_products.py
          rm -f .github/workflows/extract-catalog-context.yml
          rm -f .github/workflows/add-glow-eyes-products.yml

      - name: Commit live catalog update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Glow Eyes products to catalog"
          git push
