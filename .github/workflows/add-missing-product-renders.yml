name: Add missing product renders

on:
  push:
    paths:
      - 'tools/add_missing_product_renders.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add branded product renders
        run: python tools/add_missing_product_renders.py
      - name: Commit catalog images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add missing GLP product images"
            git push
          fi
