*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6}

nav.links{display:flex;gap:26px;font-size:14px;font-weight:500;letter-spacing:.05em;align-items:center}

.cartbtn{background:var(--ink);color:#fff;padding:8px 16px;border-radius:2px;font-size:13px;letter-spacing:.08em}
.cartbtn:hover{background:var(--gold)}
.btn{display:inline-block;background:var(--ink);color:#fff;padding:14px 30px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;border-radius:2px;transition:.2s;cursor:pointer;border:none;text-align:center}

.btn-o{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}

/* hero */

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}

.pblock ul{list-style:none}.pblock li{padding-left:20px;position:relative;margin-bottom:8px;color:#2c2a26}

.spectbl{width:100%;border-collapse:collapse}

<script>
const PRODUCTS = [{"slug":"lipo-c-b12","group":"peptides","category":"Research Peptide","name":"Lipo-C with B-12","dose":"10 mL","price":43.99,"tagline":"Methionine, inositol, choline and cyanocobalamin blend","description":"A lipotropic research blend combining methionine, inositol and choline (collectively referred to as MIC) with cyanocobalamin, supplied in bacteriostatic water. The individual constituents have been investigated in laboratory research for their roles in hepatic lipid metabolism and one-carbon methylation pathways. Methionine functions as a methyl donor in the methionine-homocysteine cycle, choline is a precursor of phosphatidylcholine and betaine, and cyanocobalamin has been characterized as a cofactor in methionine synthase activity.","benefits":["Constituents examined in preclinical research on hepatic lipid metabolism","Methionine and choline studied as methyl donors in one-carbon metabolism","Cyanocobalamin characterized as a cofactor in methionine synthase activity"],"specs":[["Composition","Methionine, Inositol, Choline + Cyanocobalamin (B-12) in bacteriostatic water"],["Formula","Blend — see COA"],["Form","Clear sterile liquid, 10 mL vial"],["Storage","Refrigerate 2–8 °C"]],"caution":false,"disclaimer":"Research use only. Not for human consumption.","img":"lipo-c-b12.jpg","wc":482,"prep_label":null,"prep":null,"dosing":null},{"slug":"bac-water","group":"peptides","name":"BAC Water","category":"Laboratory Reagent","dose":"10 mL","price":9.99,"tagline":"Sterile laboratory diluent","description":"Sterile water containing 0.9% benzyl alcohol as a bacteriostatic preservative. Benzyl alcohol has been characterized in antimicrobial research as an agent that inhibits bacterial proliferation in aqueous solution. Supplied as a sterile laboratory reagent for research applications.","benefits":["Benzyl alcohol characterized as a bacteriostatic agent in antimicrobial research","Inhibition of microbial proliferation in aqueous media described in the literature","Supplied as a sterile laboratory reagent"],"specs":[["Composition","Water for injection + 0.9% benzyl alcohol"],["CAS","7732-18-5 · 100-51-6"],["Form","Clear sterile liquid, 30 mL vial"],["Storage","Room temperature; keep sealed & sterile"]],"caution":false,"disclaimer":"Research use only. Not for human consumption.","img":"/img/bac-water-01b1de9b.jpg","wc":324,"prep_label":null,"prep":null,"dosing":null},{"slug":"mots-c","group":"peptides","name":"MOTS-C","category":"Research Peptide","dose":"10 mg","price":34,"tagline":"Mitochondrial-derived peptide","description":"A 16-amino-acid peptide encoded within the mitochondrial 12S rRNA gene. Preclinical research has characterized MOTS-c as a regulator of metabolic homeostasis, and it is frequently described in the literature as an exercise mimetic. In vitro and animal-model studies report that under conditions of metabolic stress it modulates AMPK signaling and the Nrf2 antioxidant pathway, with observed effects on glucose metabolism and insulin sensitivity in skeletal muscle.","benefits":["Insulin sensitivity and glucose homeostasis examined in animal models (Lee et al., Cell Metabolism 2015)","Exercise-mimetic effects reported in aged mice (Reynolds et al., Nat Commun 2021)","Examined in preclinical research on obesity and age-related metabolic decline"],"specs":[["CAS","1627580-64-6"],["Formula","C₁₀₁H₁₅₂N₂₈O₂₂S₂"],["Molar mass","2174.62 g/mol"],["Sequence","MRWQEMGYIFYPRKLR"],["Form","Lyophilized powder"],["Storage","−20 °C (2–8 °C in solution)"]],"caution":false,"disclaimer":"Research use only. Not for human consumption.","img":"/img/mots-c-d561218e.jpg","wc":325,"prep_label":null,"prep":null,"dosing":null},{"slug":"nad","group":"peptides","name":"NAD+","category":"Research Peptide","dose":"500 mg","price":49.99,"tagline":"Redox coenzyme","description":"Beta-nicotinamide adenine dinucleotide, a redox coenzyme central to cellular energy metabolism and a substrate for sirtuins, PARP enzymes and CD38. Because tissue NAD+ concentrations decline with age, researchers have examined NAD+ availability in relation to sirtuin signaling, DNA-repair enzyme activity and mitochondrial function across in vitro and animal-model systems.","benefits":["Characterized as a coenzyme in mitochondrial and cellular energy metabolism","Studied as a substrate in sirtuin and PARP signaling and DNA repair","Examined in preclinical research on age-related NAD+ decline","Pharmacokinetics characterized in the published literature (Grant et al., 2019)"],"specs":[["CAS","53-84-9"],["Formula","C₂₁H₂₇N₇O₁₄P₂"],["Molar mass","663.43 g/mol"],["Form","Lyophilized powder"],["Storage","−20 °C; protect from moisture"]],"caution":false,"disclaimer":"Research use only. Not for human consumption.","img":"/img/nad-c5a35f62.jpg","wc":326,"prep_label":null,"prep":null,"dosing":null},{"slug":"ghk-cu","group":"peptides","name":"GHK-Cu","category":"Research Peptide","dose":"100 mg","price":37.99,"tagline":"Copper tripeptide","description":"The copper(II) complex of the tripeptide glycyl-L-histidyl-L-lysine, a plasma-derived fragment whose concentration declines with age. Its mechanism of action has been investigated in vitro, where it functions as a copper carrier and modulates gene pathways associated with tissue repair, extracellular matrix formation and antioxidant response. Fibroblast culture studies report increased synthesis of collagen, elastin and associated growth factors.","benefits":["Collagen and extracellular matrix synthesis examined in fibroblast culture","Wound contraction, angiogenesis and granulation reported in animal models","Anti-inflammatory and antioxidant gene-expression effects observed in vitro"],"specs":[["CAS","89030-95-5 (complex)"],["Formula","C₁₄H₂₂CuN₆O₄"],["Molar mass","401.9 g/mol"],["Sequence","Gly-His-Lys · Cu²⁺"],["Form","Blue lyophilized powder"],["Storage","−20 °C; protect from light"]],"caution":false,"disclaimer":"Research use only. Not for human consumption.","img":"/img/gh
