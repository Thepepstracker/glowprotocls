<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="Serum Station"><meta name="theme-color" content="#1b1b1b"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="robots" content="noindex,nofollow">
<title>Serum Station · Glow Lab</title>
<style>
/* Serum Station (Jonah, 24 Nov 2026). 8 stir plates in a row, beaker 1 on the right. Each beaker runs its own serum:
   you see it spin, what it needs next and how long is left. Tap a beaker to work its step. Recipe mixing times lock
   Done until the timer ends, so every batch gets the same mixing. */
:root{--bg:#f7f4ee;--card:#fff;--ink:#1b1b1b;--muted:#6b6459;--line:#e4dccd;--gold:#b88a2e;--gold2:#f3d58b;--ok:#1f7a3a;--okbg:#e7f4ea;--warn:#a23b1d;--warnbg:#fbeae5;--amberbg:#fff4d6;--blue:#2f6fd0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;font-variant-numeric:tabular-nums}
a{color:inherit}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--ink);background:#fff;color:var(--ink);padding:10px 14px}
button:disabled{opacity:.4;cursor:default}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
header .row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;max-width:1120px;margin:0 auto}
h1{font-size:20px;margin:0;letter-spacing:.02em}
.hs{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:15px}
.hs .pill{background:#333;border-radius:20px;padding:3px 10px}
.hs a,.hs button{text-decoration:none;border:1px solid #555;border-radius:20px;padding:3px 10px;background:none;color:#fff;font-size:15px}
.hs .pill.hot{background:var(--gold2);color:#111;font-weight:800}
main{max-width:1120px;margin:0 auto;padding:14px 16px 60px}
/* ---- the bench: 8 stir plates ---- */
.benchwrap{background:#151515;border-radius:22px;padding:16px 10px 12px;overflow-x:auto;scrollbar-width:thin}
.bench{display:flex;flex-direction:row-reverse;gap:8px;min-width:max-content;justify-content:center;margin:0 auto}
.bk{width:126px;flex:0 0 126px;border:0;background:none;padding:6px 4px 8px;border-radius:16px;color:#fff;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.bk:hover{background:#1f1f1f}
.bk.sel{background:#262626;box-shadow:0 0 0 2px var(--gold2) inset}
.bk .no{font-size:11px;font-weight:900;letter-spacing:.16em;color:#8f887a}
.bk svg{width:96px;height:118px;overflow:visible}
.bk .nm{font-size:14px;font-weight:800;line-height:1.15;min-height:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:118px}
.bk .stp{font-size:11.5px;color:#a9a295;line-height:1.2;min-height:28px;max-width:118px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bk .big{font:800 20px/1 ui-monospace,Menlo,monospace;color:#fff;min-height:22px}
.bk .tag{font-size:11.5px;font-weight:800;border-radius:20px;padding:3px 8px;background:#2b2b2b;color:#cfc8ba;max-width:118px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk.need .tag{background:var(--gold2);color:#111;animation:pulse 1.2s ease-in-out infinite}
.bk.mix .tag{background:#1e3a66;color:#cfe0ff}
.bk.up .tag{background:#5fc27e;color:#111;animation:pulse 1.2s ease-in-out infinite}
.bk.done .tag{background:#173a22;color:#8fd6a4}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(243,213,139,.18)}}
/* svg parts */
.glass{fill:rgba(255,255,255,.06);stroke:#d9d9d9;stroke-width:2}
.tick{stroke:#bdbdbd;stroke-width:1.2}
.plate{fill:#2c2c2c;stroke:#3a3a3a}
.led{fill:#444}
.led.on{fill:#5fc27e;filter:drop-shadow(0 0 3px #5fc27e)}
.led.hot{fill:#ff7a3d;filter:drop-shadow(0 0 4px #ff7a3d)}
.liq{transition:y .6s ease,height .6s ease}
.bar{fill:#f2f2f2}
.spin .bar{animation:stir .35s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes stir{0%{transform:scaleX(1)}50%{transform:scaleX(-1)}100%{transform:scaleX(1)}}
.vortex{opacity:0}
.spin .vortex{opacity:.55;animation:swirl 1.1s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes swirl{0%{transform:scaleX(1)}50%{transform:scaleX(.55)}100%{transform:scaleX(1)}}
.bub{fill:rgba(255,255,255,.55);opacity:0}
.spin .bub{animation:rise 1.8s ease-in infinite}
.spin .bub.b2{animation-delay:.6s}.spin .bub.b3{animation-delay:1.2s}
@keyframes rise{0%{opacity:0;transform:translateY(0)}15%{opacity:.8}100%{opacity:0;transform:translateY(-46px)}}
.ring{fill:none;stroke:#333;stroke-width:4}
.ringp{fill:none;stroke:var(--gold2);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .5s linear}
.bk.up .ringp{stroke:#5fc27e}
.hint{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0;align-items:center}
.hint b{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hint button{padding:6px 11px;font-size:14px;border-radius:20px;background:var(--gold2);border-color:var(--gold2);font-weight:700}
.legend{display:flex;justify-content:space-between;color:#7d776b;font-size:12px;font-weight:700;letter-spacing:.1em;margin:6px 8px 0}
/* ---- detail ---- */
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top .nm{font-size:24px;font-weight:800;flex:1;min-width:150px}
.top .nm small{display:block;font-size:14px;font-weight:500;color:var(--muted)}
.top .bno{font-size:12px;font-weight:900;letter-spacing:.14em;color:var(--gold);display:block}
.facts{display:flex;gap:8px;flex-wrap:wrap}
.fact{background:#f3efe6;border-radius:10px;padding:6px 10px;text-align:center;min-width:76px}
.fact b{display:block;font-size:19px}
.fact span{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.fact.red{background:var(--warnbg)}.fact.red b{color:var(--warn)}
.plan{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.fld{display:flex;flex-direction:column;gap:4px}
.fld>span{font-size:13px;font-weight:700;color:var(--muted)}
.num{display:flex;align-items:center;gap:6px}
.num button{width:40px;height:40px;padding:0;font-size:20px;font-weight:800}
.num input{width:60px;height:40px;text-align:center;font:inherit;font-size:20px;font-weight:800;border:2px solid var(--ink);border-radius:10px}
.sm-btn{padding:3px 9px;font-size:13px;margin-left:6px}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 2px}
.dots button{width:32px;height:32px;padding:0;border-radius:50%;font-size:13px;font-weight:800;border:2px solid var(--line);background:#fff;color:var(--muted)}
.dots button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.dots button.cur{border-color:var(--ink);color:var(--ink);box-shadow:0 0 0 3px rgba(184,138,46,.35)}
.step{background:#141414;color:#fff;border-radius:20px;padding:20px;margin-top:12px}
.step .k{font-size:12px;font-weight:800;letter-spacing:.16em;color:var(--gold2);text-transform:uppercase}
.step h2{margin:4px 0 6px;font-size:28px;line-height:1.15}
.step .d{color:#d9d3c7;font-size:16.5px}
.step .d b{color:#fff}
.weigh{display:grid;gap:8px;margin:14px 0 0}
.w{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#222;border:2px solid #333;border-radius:14px;padding:10px 12px;color:#fff}
.w .amt{font-size:26px;font-weight:900;min-width:118px;color:var(--gold2)}
.w .wn{flex:1;font-size:17px;font-weight:600;min-width:0}
.w .wn small{display:block;font-size:13px;color:#9a9385;font-weight:500}
.w .bx{flex:0 0 40px;height:40px;border-radius:10px;border:2px solid #555;display:grid;place-items:center;font-size:20px}
.w.on{border-color:#2f8a4a;background:#173a22}.w.on .bx{background:#5fc27e;border-color:#5fc27e;color:#111}.w.on .amt{color:#8fd6a4}
.clock{display:flex;align-items:center;gap:14px;margin-top:16px;background:#222;border-radius:14px;padding:12px 14px}
.clock .t{font:800 34px/1 ui-monospace,Menlo,monospace;min-width:110px}
.clock .l{flex:1;font-size:14px;color:#cfc8ba}
.clock .l b{color:#fff}
.clock button{background:var(--gold2);border-color:var(--gold2);color:#111;font-weight:800}
.clock.run .t{color:var(--gold2)}
.clock.up{background:#173a22}.clock.up .t{color:#8fd6a4}
.flag{margin-top:12px;background:#3a2c0e;color:#f3d58b;border-radius:10px;padding:8px 12px;font-size:14px}
.nav{display:flex;gap:10px;margin-top:16px;align-items:center}
.nav .back{background:none;border-color:#555;color:#ddd}
.nav .done{flex:1;font-size:20px;font-weight:900;padding:16px;background:#5fc27e;border-color:#5fc27e;color:#111;border-radius:14px}
.nav .done:disabled{background:#333;border-color:#333;color:#888;opacity:1}
.next{margin-top:10px;font-size:14px;color:var(--muted)}
.next b{color:var(--ink)}
.note{background:var(--amberbg);border:1px solid #f0d58c;border-radius:10px;padding:8px 12px;margin-top:12px;font-size:15px;color:#5a3b00}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.row+.row{margin-top:10px}
.txt{font:inherit;font-size:17px;padding:8px 10px;height:40px;border:2px solid var(--line);border-radius:10px;background:#fff}
.txt:focus,.num input:focus{outline:none;border-color:var(--ink)}
.chk{display:flex;gap:8px;align-items:center;font-weight:600;font-size:15px}
.chk input{width:20px;height:20px;accent-color:var(--ok)}
.go{font-weight:900;background:var(--ok);color:#fff;border-color:var(--ok);font-size:19px;padding:14px 20px;border-radius:14px}
.lot{font-size:34px;font-weight:900;letter-spacing:.04em;margin:6px 0 10px}
.src{font-size:12.5px;color:var(--muted);margin-top:12px}
.small{font-size:14px;color:var(--muted)}
.msg{padding:16px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:12px}
.pick{text-align:left;border:2px solid var(--line);border-radius:14px;padding:14px;background:#fff;display:flex;gap:10px;align-items:flex-start}
.pick i{flex:0 0 14px;height:14px;border-radius:50%;margin-top:6px}
.pick b{display:block;font-size:19px}
.pick span{display:block;font-size:13.5px;color:var(--muted);margin-top:2px}
.pick .w8{display:inline;color:var(--warn);font-weight:800}
.clear,.dots .clear{background:none;border:1px solid var(--line);color:var(--muted);font-size:14px;padding:6px 10px;width:auto;height:auto;border-radius:10px;font-weight:600}
table{width:100%;border-collapse:collapse;background:var(--card);min-width:600px}
td,th{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:15px}
th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td.b{font-weight:800;white-space:nowrap}
tr.void td{opacity:.5;text-decoration:line-through}tr.void td.act{opacity:1;text-decoration:none}
.tscroll{overflow-x:auto;border-radius:12px;border:1px solid var(--line);margin-top:14px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1}
@media (max-width:600px){.bk{width:104px;flex-basis:104px}.bk svg{width:80px;height:98px}.bk .nm,.bk .stp,.bk .tag{max-width:98px}.step h2{font-size:24px}.w .amt{font-size:22px;min-width:96px}.clock .t{font-size:28px;min-width:90px}.top .nm{font-size:21px}.hide-sm{display:none}.bench{justify-content:flex-start}}
/* ---- iPad (Jonah, 24 Nov 2026: "make an adaptation for ipad, for serums") ----
   Touch: no double-tap zoom, no grey tap flash, bigger targets. 700px+ (iPad portrait): all 8 beakers fit across, no
   sideways scroll, beaker 1 still on the right. 1000px+ (iPad landscape): the step on the left, the beaker card on the right. */
html{-webkit-text-size-adjust:100%}
button,.w,.bk{touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:max(60px,env(safe-area-inset-bottom,0px))}
.work{display:flex;flex-direction:column}.work .wb{order:-1}
#wakeBtn[hidden]{display:none}
@media (min-width:700px){
 .benchwrap{overflow:visible;padding:16px 8px 12px}
 .bench{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));direction:rtl;gap:6px;min-width:0}
 .bench>.bk{direction:ltr;width:auto;flex:none;min-width:0}
 .bk svg{width:100%;max-width:96px;height:auto;aspect-ratio:100/120}
 .bk .nm,.bk .stp,.bk .tag{max-width:100%}
 .bk .tag{white-space:normal;line-height:1.2;font-size:12px}
}
@media (min-width:1000px){
 .work{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;align-items:start}
 .work .wb{order:0;grid-column:2;grid-row:1}.work .wa{grid-column:1;grid-row:1}.work .wa .step,.work .wa>.card{margin-top:14px}
 .work .wb>.card:first-child{position:sticky;top:76px}
}
@media (pointer:coarse){
 .num button{width:52px;height:52px;font-size:24px}.num input{width:72px;height:52px;font-size:22px}
 .dots button{width:40px;height:40px;font-size:15px}
 .w{padding:14px 14px;min-height:64px}.w .bx{flex-basis:48px;height:48px}
 .nav .done{padding:20px;font-size:22px}.nav .back{padding:16px 18px}
 .clock button{padding:14px 20px;font-size:18px}
 .hint button{padding:10px 14px;font-size:15px}
 .txt{height:52px;font-size:19px}
 .go{padding:18px 24px;font-size:20px}
 .pick{padding:18px}
}
@media (prefers-reduced-motion:reduce){.spin .bar,.spin .vortex,.spin .bub,.bk.need .tag,.bk.up .tag{animation:none}}
button:focus-visible,input:focus-visible{outline:3px solid rgba(184,138,46,.6);outline-offset:2px}
</style>
</head>
<body>
<header>
  <div class="row">
    <h1><a href="/store-next/admin" id="backApp" hidden style="text-decoration:none;margin-right:10px;font-weight:600">‹ App</a>Serum Station</h1>
    <div class="hs"><span id="count"></span><span class="pill hide-sm" id="today"></span><button type="button" id="wakeBtn" data-wake="1" hidden>🔆 Screen on</button><button type="button" data-log="1">Batch log</button><a href="/store-next/packing.html">Packing Check</a></div>
  </div>
</header>
<main>
  <div id="signin"></div>
  <div class="benchwrap"><div class="bench" id="bench"></div><div class="legend"><span>← 8</span><span>Beaker 1 →</span></div></div>

</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
'use strict';

// -----------------------------------------------------------------------------------------------------------------
var P01_STEPS=[
 {t:'Set up',d:'Gloves on. Sanitize the table, both beakers, stir bars, spatulas, pipettes and bottles.',min:5,est:true},

 {t:'Dissolve the panthenol',d:'Sprinkle it in slowly. Stir until no powder shows.',uses:['panth'],min:10},
 {t:'Cool it down',d:'Heat <b>off</b>. Keep stirring until it reads <b>under 30 °C</b>.',until:'Under 30 °C'},
 {t:'Start the main beaker',d:'Big beaker, stir bar, <b>low</b> speed. No big whirlpool.',uses:['ha'],min:2,est:true},
 {t:'Add the glycerin',d:'Pour in slowly while it stirs.',uses:['gly'],min:3},
 {t:'Pour in the panthenol mix',d:'Only once it’s cool. Pour slowly. Look for smooth, no clumps.',min:5},
 {t:'Add the SNAP-8',d:'Weigh carefully. Add slowly. No heat.',uses:['snap'],min:10,only:'snap'},
 {t:'Add the GHK-Cu',d:'Add slowly so it spreads out. Stir gently until it’s all one even blue.',uses:['ghk'],min:15},
 {t:'Add the Germall Plus',d:'Weigh it on the scale. Don’t eyeball it.',uses:['germ'],min:5},
 {t:'Check weight + pH',d:'Should weigh <b>{total}</b> (top up with HA base only). Test a sample: <b>pH 5.0–5.8</b>, best 5.3–5.6.',min:3,est:true},
 {t:'Final mix',d:'Gentle stir. No foam, no heat.',min:10},
 {t:'Rest',d:'Stirrer off. Cover it. Let the bubbles rise out.',min:30},
 {t:'Fill',d:'Fill {fill}.',min:15,est:true}];
function EYE_STEPS(kpv){var s=[
 {t:'Set up',d:'Gloves on. Sanitize a small beaker, stir bar and the rollers.',min:3,est:true},
 {t:'Measure the Protocol 01',d:'Into a clean beaker. Short on it? Tap <b>Make Protocol 01 first</b> up top.',uses:['p01'],min:2,est:true},
 {t:'Make the caffeine mix',d:'Pour about <b>{cut}</b> of the serum into the small beaker. Add the caffeine a little at a time. Stir until fully dissolved. No hard heat.',uses:['caff'],until:'Fully dissolved'}];
 if(kpv)s.push({t:'Add the KPV',d:'{perbottle} for every bottle. Stir until fully dissolved.',uses:['kpv'],until:'Fully dissolved',flag:'How the KPV goes in wasn’t written down in the chats. Do it the way you have been.'});
 s.push({t:'Blend it back in',d:'Slowly stir the caffeine mix back into the rest until it’s all the same.',until:'Even all the way through'},
 {t:'Check pH',d:'Same as Protocol 01: <b>pH 5.0–5.8</b>.',min:3,est:true},
 {t:'Fill',d:'Fill {fill}.',min:10,est:true});return s}
function HAIR_STEPS(cu){return [
 {t:'Set up',d:'Gloves on. Sanitize both beakers, stir bars and the droppers.',min:5,est:true},
 {t:'Water + HA',d:'Main beaker. Mix until it’s all the same.',uses:['water','ha'],min:3,est:true},
 {t:'Add the aloe',d:'Mix gently.',uses:['aloe'],min:2,est:true},
 {t:'Dissolve the powders',d:'Second beaker. Warm gently, <b>45 °C max</b>, stir until dissolved.',uses:['pdo','nia','panth'],until:'No grit left',flag:'Thick and stringy? Add 5–10 g warm water from the main amount and stir 15–20 min more.'},
 {t:'Combine',d:'Slowly pour the dissolved mix into the main beaker.',min:10},
 {t:'Add the '+cu,d:'Gently. No heat, no fast stir, no whisk.',uses:['cu'],min:5,est:true},
 {t:'Add the Germall Plus',d:'Weigh it on the scale.',uses:['germ'],min:5,est:true},
 {t:'Fill',d:'Fill {fill}.',min:15,est:true}]}
var RECIPES=[
 {key:'protocol-01',code:'P01',name:'Protocol 01',sub:'GHK-Cu + SNAP-8 face serum',ref:225,
  yields:[{sku:'protocol-01-15-ml-0-5-oz',ml:15,def:15,label:'15 mL'},{sku:'protocol-01-50-ml-1-7-oz',ml:50,def:0,label:'50 mL'},{sku:'bf-mini-protocol-01',ml:1,def:0,label:'1 mL mini'}],
  ing:[{id:'water',n:'Distilled water',s:'10 mL = 10 g (water)',g:10,u:'mL'},{id:'pdo',n:'Propanediol 1,3',g:11.75},{id:'panth',n:'DL-Panthenol',g:4.7},{id:'ha',n:'Premade HA base',s:'your 1% HA',g:201.5},{id:'gly',n:'Vegetable glycerin',g:4.7},{id:'snap',n:'SNAP-8',g:0.235},{id:'ghk',n:'GHK-Cu',g:0.94},{id:'germ',n:'Liquid Germall Plus',g:1.175}],
  steps:P01_STEPS,
  src:'ChatGPT › Glow Protocols › “GHK-cu Serum Recipe”: printable batch record of Sep 8, 2026 (235 g by weight, 0.40% GHK-Cu, 0.10% SNAP-8). Weigh everything except the water. Mixing times are the sheet’s.'},

 return '<div class="work"><div class="wb">'+head+'</div><div class="wa">'+'<div class="step"><div class="k">Beaker '+(bench.sel+1)+' · Step '+(st.cur+1)+' of '+steps.length+'</div><h2>'+esc(x.t)+'</h2><div class="d">'+d+'</div>'+(ws?'<div class="weigh">'+ws+'</div>':'')+clock+(x.flag?'<div class="flag">'+esc(x.flag)+'</div>':'')+
  '<div class="nav">'+(st.cur>0?'<button type="button" class="back" data-go="'+(st.cur-1)+'">Back</button>':'')+'<button type="button" class="done" data-done="1"'+((locked||!allGot)?' disabled':'')+'>'+(!allGot?'Tap what you added':locked?'Wait for the timer':'Done ✓')+'</button></div></div>'+
  '<div class="next">'+(nx?'Next: <b>'+esc(nx.t)+'</b>'+(nx.min?' · '+(nx.est?'≈ ':'')+nx.min+' min':nx.until?' · until '+esc(nx.until.toLowerCase()):''):'Next: <b>Finish</b> and add the bottles to stock')+'</div>'+
  '<div class="src">Recipe: '+esc(r.src)+' Times with ≈ are our usual time, not from the recipe.</div></div></div>'}
function finishHtml(r){var who=st.who!=null?st.who:ls(WHO_K,''),miss=r.yields.filter(function(y){return !bySku[y.sku]}).map(function(y){return y.label});
 var fills=r.prep?'':r.yields.map(function(y,i){return numFld('f-'+i,st.filled&&st.filled[i]!=null?st.filled[i]:st.counts[i],'Filled · '+y.label)}).join('');
 return '<div class="card"><div class="top"><div class="nm">Finish<small>Enter what you actually filled</small></div></div>'+(miss.length?'<div class="note">Not on the site, so not added to stock: '+esc(miss.join(', '))+'</div>':'')+
  '<div class="row" style="margin-top:12px">'+fills+'<label class="fld"><span>pH</span><input class="txt" id="ph" style="width:86px" inputmode="decimal" placeholder="5.4" value="'+esc(st.ph||'')+'"></label><label class="fld" style="flex:1;min-width:150px"><span>Made by</span><input class="txt" id="who" placeholder="Your name" value="'+esc(who)+'"></label></div>'+
  '<div class="row"><label class="fld" style="flex:1"><span>Notes</span><input class="txt" id="notes" placeholder="Anything unusual" value="'+esc(st.notes||'')+'"></label></div>'+
  '<div class="row" style="justify-content:space-between;margin-top:14px">'+(r.prep?'<span class="small">HA base isn’t sold, so it only goes in the log.</span>':'<label class="chk"><input type="checkbox" id="addstock" '+(st.addStock===false?'':'checked')+'> Add to the site’s stock</label>')+'<button type="button" class="go" data-finish="1"'+(authed?'':' disabled')+'>'+finishLabel(r)+'</button></div></div>'}
function finishLabel(r){if(r.prep||st.addStock===false)return '✓ Log batch';var n=0;r.yields.forEach(function(y,i){var v=st.filled&&st.filled[i]!=null?st.filled[i]:st.counts[i];if(bySku[y.sku])n+=Number(v)||0});return '✓ Finish · add '+n+' to stock'}
function doneHtml(r){var b=st.result,added=(b.yields||[]).filter(function(y){return y.added}).map(function(y){return '<div style="font-size:17px;margin:4px 0"><b>+'+y.added+'</b> '+esc(y.name)+' <span class="small">('+y.stock_before+' → '+y.stock_after+')</span></div>'}).join('');
 return '<div class="card" style="border-color:var(--ok);background:var(--okbg)"><div class="small">Beaker '+(bench.sel+1)+' · write this on the bottles</div><div class="lot">'+esc(b.lot)+'</div>'+(added||'<div class="small">Logged. Stock not changed.</div>')+'<div class="row" style="margin-top:14px"><button type="button" class="go" data-again="1">Another '+esc(r.name)+' here</button><button type="button" data-clear="1">Empty this beaker</button></div></div>'}
function logHtml(){if(!authed)return '<div class="msg" style="margin-top:14px">Sign in to see the batch log.</div>';if(!batches.length)return '<div class="msg" style="margin-top:14px">No batches yet.</div>';
 return '<div class="tscroll"><table><thead><tr><th>Lot</th><th>When</th><th>Made</th><th>pH</th><th>By</th><th></th></tr></thead><tbody>'+batches.map(function(b){
  var made=(b.yields||[]).filter(function(y){return y.quantity}).map(function(y){return y.quantity+' × '+esc(y.name)}).join('<br>')||esc(b.name+(b.batch_g?' · '+b.batch_g+' g':''));
  return '<tr class="'+(b.voided_at?'void':'')+'"><td class="b">'+esc(b.lot)+'</td><td>'+esc(new Date(b.created*1000).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}))+'</td><td>'+made+(b.added_to_stock?'':'<br><span class="small">not added to stock</span>')+(b.notes?'<br><span class="small">'+esc(b.notes)+'</span>':'')+'</td><td>'+esc(b.ph||'—')+'</td><td>'+esc(b.made_by)+'</td><td class="act">'+(b.voided_at?'<span class="small">undone</span>':'<button type="button" data-void="'+esc(b.id)+'" style="padding:5px 10px;font-size:14px">'+(voidArm===b.id?'Tap again':'Undo')+'</button>')+'</td></tr>'}).join('')+'</tbody></table></div><p class="small">Undo takes that batch’s bottles back off stock (not if they already sold).</p>'}
// ---- clock: every beaker's countdown, chime when one ends ----------------------------------------------------------
function chime(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();[0,.25,.5].forEach(function(d){var o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.setValueAtTime(.0001,actx.currentTime+d);g.gain.exponentialRampToValueAtTime(.25,actx.currentTime+d+.02);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d+.2);o.connect(g).connect(actx.destination);o.start(actx.currentTime+d);o.stop(actx.currentTime+d+.22)})}catch(e){}}
function ensureTick(){if(tick)return;tick=setInterval(function(){var rang=false;for(var i=0;i<N;i++){var s=bench.slots[i];if(!s||s.result)continue;var tm=s.timer[s.cur];if(tm&&!tm.rang&&tm.end<=Date.now()){tm.rang=true;rang=true;var x=stepsOf(rec(s.recipe))[s.cur];toast('⏱ Beaker '+(i+1)+': '+(x?x.t:'step')+' is done');}}
 if(rang){chime();if(st)bench.slots[bench.sel]=st;lsSet(STATE_K,bench);render();return}updateLive()},500)}
// ---- events ------------------------------------------------------------------------------------------------------
function readInputs(){if(!st||st.result)return;var r=rec(st.recipe);r.yields.forEach(function(y,i){var a=$('n-'+i);if(a)st.counts[i]=Math.max(0,parseInt(a.value,10)||0);var f=$('f-'+i);if(f){st.filled=st.filled||[];st.filled[i]=Math.max(0,parseInt(f.value,10)||0)}});
 var g=$('n-g');if(g)st.grams=Math.max(0,parseInt(g.value,10)||0);['ph','notes','who'].forEach(function(k){var x=$(k);if(x)st[k]=x.value});var a=$('addstock');if(a)st.addStock=a.checked}
document.addEventListener('click',function(ev){var t=ev.target.closest('button');if(!t)return;var r=st&&rec(st.recipe);
 if(t.dataset.bk!=null){readInputs();var i=Number(t.dataset.bk);if(i===bench.sel&&view==='bench'&&st&&st.result){bench.slots[i]=null;st=null}select(i);return}
 if(t.dataset.log){readInputs();save();view=view==='log'?'bench':'log';render();return}
 if(t.dataset.start){st=fresh(rec(t.dataset.start));view='bench';render();return}
 if(t.dataset.clear){if(started()&&clearArm!==bench.sel){clearArm=bench.sel;toast('Tap “Empty this beaker” again to clear it. Its progress will be lost.');setTimeout(function(){clearArm=null},4000);return}clearArm=null;bench.slots[bench.sel]=null;st=null;render();return}
 if(t.dataset.nudge){readInputs();var inp=$(t.dataset.nudge);inp.value=Math.max(0,(parseFloat(inp.value)||0)+Number(t.dataset.d));readInputs();if(/^n-/.test(t.dataset.nudge))st.filled=null;render();return}
 if(t.dataset.edit){st.cur=0;st.done={};render();return}
 if(t.dataset.got){st.got[t.dataset.got]=!st.got[t.dataset.got];render();return}
 if(t.dataset.timer){if(t.dataset.timer==='go'){var x=stepsOf(r)[st.cur];st.timer[st.cur]={end:Date.now()+x.min*60000};try{actx=actx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}else delete st.timer[st.cur];render();return}
 if(t.dataset.done){st.done[st.cur]=true;st.cur++;render();return}
 if(t.dataset.go!=null){readInputs();st.cur=Number(t.dataset.go);render();return}
 if(t.dataset.p01){var n=Number(t.dataset.p01),free=-1;for(var k=0;k<N;k++)if(!bench.slots[k]&&k!==bench.sel){free=k;break}if(free<0){toast('No empty beaker. Empty one first.');return}
  save();var p=fresh(rec('protocol-01'));p.counts=[n,0,0];bench.slots[free]=p;select(free);toast('Protocol 01 ('+n+' × 15 mL) started in beaker '+(free+1)+'.');return}
 if(t.dataset.again){st=fresh(r);render();return}
 if(t.dataset.finish){finish(t);return}
 if(t.dataset.void){var id=t.dataset.void;if(voidArm!==id){voidArm=id;render();setTimeout(function(){if(voidArm===id){voidArm=null;render()}},5000);return}
  voidArm=null;api('serums/batch/void',{id:id}).then(function(d){toast('Undone: '+d.batch.lot);return reload()}).catch(function(e){toast(e.message)})}});
var clearArm=null;function started(){return st&&!st.result&&(Object.keys(st.done).length||Object.keys(st.got).length)}
document.addEventListener('change',function(ev){if(!st)return;var id=ev.target.id;if(/^(n-|f-|addstock)/.test(id)){readInputs();if(/^n-/.test(id))st.filled=null;render()}});
document.addEventListener('input',function(ev){if(st&&/^(ph|who|notes)$/.test(ev.target.id)){readInputs();save()}});
function finish(btn){readInputs();var r=rec(st.recipe),who=(st.who||ls(WHO_K,'')||'').trim();if(!who){toast('Add who made it.');$('who').focus();return}lsSet(WHO_K,who);
 var yields=[];r.yields.forEach(function(y,i){var p=bySku[y.sku],q=st.filled&&st.filled[i]!=null?st.filled[i]:st.counts[i];if(p&&q>0)yields.push({id:p.id,quantity:Number(q)})});
 if(!r.prep&&!yields.length){toast('Enter how many you filled.');return}btn.disabled=true;btn.textContent='Saving…';var slot=bench.sel,mine=st;
 api('serums/batch',{key:st.key,recipe:r.key,code:r.code,name:r.name,made_by:who,ph:String(st.ph||'').trim(),notes:String(st.notes||'').trim(),batch_g:Math.round(total(r,st)*1000)/1000,
  ingredients:r.ing.map(function(i){return{name:i.n,amount:Math.round(amt(r,st,i)*1000)/1000,unit:i.u||'g'}}),yields:yields,add_stock:r.prep?false:st.addStock!==false})
 .then(function(d){mine.result=d.batch;bench.slots[slot]=mine;lsSet(STATE_K,bench);toast((d.already?'Already logged: ':'Logged ')+d.batch.lot);return reload()}).catch(function(e){btn.disabled=false;btn.textContent=finishLabel(r);toast(e.message)})}
// ---- load --------------------------------------------------------------------------------------------------------
function reload(){return Promise.all([api('data').then(function(d){products=d.products||[];orders=d.orders||[];bySku={};byId={};products.forEach(function(p){byId[p.id]=p;if(p.brand!=='zader'||!bySku[p.sku])bySku[p.sku]=p});buildNeed()}),
 api('serums/batches').then(function(d){batches=d.batches||[]})]).then(function(){authed=true;$('signin').innerHTML=''}).catch(function(e){if(authed)toast(e.message)}).then(function(){var f=document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName);if(!f)render()})}
load();render();try{var bw=document.querySelector('.benchwrap');bw.scrollLeft=bw.scrollWidth}catch(e){}reload();
// Keep the iPad screen on while beakers are going (Safari 16.4+), so timers and chimes aren't missed. Tap to turn off.
var wl=null,wantWake=ls('glp_serum_wake_v1',true);
function anyGoing(){return bench.slots.some(function(s){return s&&!s.result})}
function renderWake(){var b=$('wakeBtn');if(!b)return;if(!('wakeLock' in navigator)){b.hidden=true;return}b.hidden=false;b.textContent=wl?'🔆 Screen stays on':wantWake?'🔆 Tap to keep screen on':'🌙 Screen can sleep'}
function wake(){renderWake();if(!wantWake||wl||!('wakeLock' in navigator)||document.hidden||!anyGoing())return;navigator.wakeLock.request('screen').then(function(l){wl=l;l.addEventListener('release',function(){wl=null;renderWake()});renderWake()}).catch(function(){renderWake()})}
document.addEventListener('click',function(ev){var b=ev.target.closest('[data-wake]');if(b){wantWake=!wantWake;lsSet('glp_serum_wake_v1',wantWake);if(!wantWake&&wl){wl.release();wl=null}renderWake()}wake()},true);
// iPad only plays sound after a tap: unlock the chime on the first touch.
document.addEventListener('touchend',function unlock(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}document.removeEventListener('touchend',unlock)},{passive:true});
document.addEventListener('visibilitychange',function(){if(!document.hidden){reload();wake()}});
renderWake();wake();
// Opened from the Glow Admin app's More sheet (?from=app): show ‹ App to go back (Jonah, 24 Nov 2026).
try{if(new URLSearchParams(location.search).get('from')==='app')sessionStorage.setItem('glp_serum_from_app','1');if(sessionStorage.getItem('glp_serum_from_app')==='1')$('backApp').hidden=false}catch(e){}
})();
</script>
