# New storefront is the public shopping entry point. Legacy order records stay in WordPress.
[[redirects]]
  from = "/"
  to = "/store-next/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/index.html"
  to = "/store-next/"
  status = 302
  force = true

[[redirects]]
  from = "/checkout.html"
  to = "/store-next/"
  status = 302
  force = true

[[redirects]]
  from = "/cart"
  to = "/store-next/"
  status = 302

[[redirects]]
  from = "/my-account"
  to = "/store-next/account"
  status = 302

[[redirects]]
  from = "/store-next/account"
  to = "/store-next/index.html"
  status = 200

[[redirects]]
  from = "/store-next/account-setup"
  to = "/store-next/index.html"
  status = 200

[[redirects]]
  from = "/store-next/profile/:affiliate"
  to = "/store-next/index.html"
  status = 200

[[redirects]]
  from = "/store-next/admin"
  to = "/store-next/index.html"
  status = 200

[[redirects]]
  from = "/store-next/:affiliate"
  to = "/store-next/index.html"
  status = 200

# The retired static store (index.html) must never open for a customer: its "Add to Order"
# sends the bag to glps.shop, which now lands on an empty bag here. Real files (coa.html,
# about.html, ...) are still served first because these rules are not forced.
[[redirects]]
  from = "/checkout"
  to = "/store-next/"
  status = 302
  force = true

[[redirects]]
  from = "/checkout/"
  to = "/store-next/"
  status = 302
  force = true

[[redirects]]
  from = "/shop"
  to = "/store-next/"
  status = 302

[[redirects]]
  from = "/shop/*"
  to = "/store-next/"
  status = 302

[[redirects]]
  from = "/product/*"
  to = "/store-next/"
  status = 302

[[redirects]]
  from = "/account"
  to = "/store-next/account"
  status = 302

# Short affiliate links: glowglps.com/holly-marshall -> that affiliate's store.
[[redirects]]
  from = "/:slug"
  to = "/store-next/:slug"
  status = 302

[[redirects]]
  from = "/:slug/"
  to = "/store-next/:slug"
  status = 302

[[redirects]]
  from = "/*"
  to = "/store-next/"
  status = 302

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/price-desk.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"

[[headers]]
  for = "/store-next/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"

[functions."store-next"]
  node_bundler = "esbuild"
  external_node_modules = ["pg", "sharp"]
  included_files = ["node_modules/@img/sharp-linux-x64/**", "node_modules/@img/sharp-libvips-linux-x64/**"]

[functions."store-email-worker"]
  node_bundler = "esbuild"
  external_node_modules = ["pg"]

[functions."store-shipping-worker"]
  node_bundler = "esbuild"
  external_node_modules = ["pg"]
