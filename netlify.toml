# netlify.toml — Glow Protocols deployment config

[build]
  publish = "."
  # bakes catalog.json into the storefront; fails the deploy rather than shipping
  # a page that shows a price the checkout would not charge
  command = "node tools/sync-catalog.mjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

[[edge_functions]]
  function = "fix-product-images"
  path = "/*"

# Zader Health (zaderhealth.com) is a second brand on this same store: same Management area,
# same stock counts, its own catalog and look. Domain rules must come before the Glow rules below.
