# netlify.toml — Glow Protocols deployment config

[build]
  publish = "."
  # bakes catalog.json into the storefront; fails the deploy rather than shipping
  # a page that shows a price the checkout would not charge
  command = "node tools/sync-catalog.mjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

[[edge_functions]]
  function = "fix-product-images"
  path = "/*"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/price-desk.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"
